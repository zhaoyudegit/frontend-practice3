<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>山城印象 · 重庆专题页</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .card-title {
      color: #198754;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-md bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand" href="#">山城印象</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <div class="navbar-nav">
          <a class="nav-link active" href="#spots">热门景点</a>
          <a class="nav-link" href="#">关于</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <section id="spots">
      <h2 class="mb-3">热门景点</h2>
      <div class="row g-3">
        <div class="col-md-6 col-lg-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">洪崖洞</h5>
              <p class="card-text">依山而建的吊脚楼群，夜景神似《千与千寻》场景。</p>
              <a href="#" class="btn btn-primary">查看详情</a>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-lg-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">长江索道</h5>
              <p class="card-text">横跨长江的"空中巴士"，感受立体山城的独特交通。</p>
              <a href="#" class="btn btn-primary">查看详情</a>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-lg-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">磁器口古镇</h5>
              <p class="card-text">千年古镇，石板老街飘着陈麻花与酸辣粉的香气。</p>
              <a href="#" class="btn btn-primary">查看详情</a>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-lg-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">解放碑</h5>
              <p class="card-text">重庆地标与商业中心，八一路好吃街就在旁边。</p>
              <a href="#" class="btn btn-primary">查看详情</a>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-lg-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">武隆天生三桥</h5>
              <p class="card-text">世界自然遗产，喀斯特天生桥群，《变形金刚》取景地。</p>
              <a href="#" class="btn btn-primary">查看详情</a>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-lg-4">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">大足石刻</h5>
              <p class="card-text">唐宋摩崖造像瑰宝，世界文化遗产，千手观音震撼人心。</p>
              <a href="#" class="btn btn-primary">查看详情</a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="text-center text-secondary py-4 border-top">
    <p>山城印象 · 重庆专题页 · Bootstrap 栅格练习</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
